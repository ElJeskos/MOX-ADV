    function packageContent(){const items=shortlist();return `<header class="artifact-head"><div><p class="eyebrow">Шаг 5 · Human Decision Gate</p><h2>Проверить точный пакет кампаний</h2><p>Одно решение разрешает несколько независимых операций. У каждой кампании собственные progress, error и non-serving readback; общей транзакции нет.</p></div><strong>SIMULATION · NO API</strong></header><div class="package-summary"><div><span>Кампаний в пакете</span><strong>${items.length}</strong><small>Каждая станет отдельной кампанией Direct.</small></div><div><span>Экспозиция</span><strong>24 000 ₽ / неделю</strong><small>Общий лимит Strategy; распределение показано в проекциях.</small></div><div><span>Безопасный финал</span><strong>Только SUSPENDED</strong><small>Успех без подтверждённого readback невозможен.</small></div></div><div class="package-warning"><strong>Пакет — единица выбора, но не атомарная внешняя операция.</strong><p>Ошибка одной кампании не откатывает подтверждённые SUSPENDED readbacks других. Неизвестный readback остаётся отдельным блокирующим состоянием и требует повторной проверки.</p></div><div class="package-list">${items.map((d,index)=>{const st=packageStatus(d.id);return `<article class="package-item"><header><div><h3>${index+1}. ${esc(d.campaign_name)}</h3><span>${d.kind} · score ${scoreOf(d).score}/100 · ${d.evidence}</span></div><span class="pill">${esc(d.frequency)} · ${esc(d.cost)}</span></header><details><summary style="margin-top:8px;font-size:8px;cursor:pointer">Точная publish projection</summary><div class="projection"><div><span>Группа</span><strong>${esc(d.group_name)}</strong></div><div><span>Ключевая фраза</span><strong>${esc(d.keyword)}</strong></div><div><span>Заголовок</span><strong>${esc(d.ad_title)}</strong></div><div><span>Посадочная</span><strong>${esc(d.landing_page)}</strong></div></div></details><div class="status-line"><i class="status-dot ${st.kind}"></i><strong>${esc(st.title)}</strong><span>${esc(st.detail)}</span>${st.retry?`<button data-action="retry-readback" data-id="${d.id}">Повторить readback</button>`:""}</div></article>`}).join("")}</div><label class="decision-box"><input type="checkbox" data-action="confirm" ${state.confirmed?"checked":""}><span><strong>Разрешаю создать именно эти ${items.length} кампании</strong><span>Показы и списания не должны начаться; каждый успех требует подтверждённого Direct readback SUSPENDED.</span></span></label><div class="package-actions"><button data-action="back-drafts">← Вернуться к shortlist</button><button class="primary" data-action="simulate-package" ${!state.confirmed||state.packageStarted?"disabled":""}>${state.packageStarted?"Сценарий запущен":"Смоделировать независимое создание"}</button></div>`}
    function shell(){const packageStep=state.step==="package";return `<header class="topbar"><div class="brand"><b>M</b>MOX-ADV</div><nav><strong>Стратегия</strong><span>Production Module · P0</span></nav><div class="ready"><i></i>Disposable evidence</div></header><div class="prototype-ribbon">PROTOTYPE · ISSUE 98 · NO API WRITES</div><main class="page"><section class="hero"><div><p class="eyebrow">GPT SITES · PRODUCT DECISION PROTOTYPE</p><h1>Стратегия и создание кампании</h1><p>Проверяем полотно рекламных кампаний, shortlist и package review. Production-модуль не изменён; все состояния живут только в памяти этой страницы.</p></div><strong class="real-badge">1920 × 1080 · UI ONLY</strong></section><ol class="steps"><li><button class="done"><span>✓</span><div><strong>Контекст</strong><small>Реальные подключения</small></div></button></li><li><button class="done"><span>✓</span><div><strong>Модель бизнеса</strong><small>Evidence snapshot</small></div></button></li><li><button class="done"><span>✓</span><div><strong>Стратегия кампании</strong><small>Утверждена владельцем</small></div></button></li><li><button data-action="back-drafts" class="${packageStep?"done":"current"}"><span>${packageStep?"✓":"4"}</span><div><strong>Рекламные кампании</strong><small>Отбор и редактирование</small></div></button></li><li><button data-action="package" class="${packageStep?"current":""}" ${shortlist().length?"":"disabled"}><span>5</span><div><strong>Подтверждение</strong><small>Независимый batch</small></div></button></li></ol><div class="workspace"><aside class="agent-pane"><div class="agent-head"><span>AI</span><div><strong>Агент кампании</strong><small>Campaign review · prototype</small></div></div><section class="agent-message"><strong>${packageStep?"Подтверждение":"Рекламные кампании"}</strong><p>${packageStep?"Показываю точный пакет и честные независимые outcomes без обещания атомарности.":"Ранжирую, раскрываю evidence и оставляю человеку shortlist и точную внешнюю запись."}</p></section><section class="side-block"><h3>Набор рекомендаций</h3><div class="side-metric"><span>Всего кандидатов</span><strong>${state.drafts.length}</strong></div><div class="side-metric"><span>В review</span><strong>${state.drafts.filter(d=>!d.hidden).length}</strong></div><div class="side-metric"><span>Скрыто с причиной</span><strong>${state.drafts.filter(d=>d.hidden).length}</strong></div><div class="side-metric"><span>Shortlist</span><strong>${shortlist().length}</strong></div></section><section class="safety"><span>NON-SERVING SAFETY</span><strong>SUSPENDED only</strong><small>Успех кампании невозможен до отдельного подтверждённого readback.</small></section></aside><section class="artifact">${packageStep?packageContent():draftContent()}</section></div></main><div class="switcher"><button data-action="variant-prev" aria-label="Предыдущий вариант">←</button><strong>${state.variant} — ${variantNames[state.variant]} <span>· ← →</span></strong><button data-action="variant-next" aria-label="Следующий вариант">→</button></div>${state.toast?`<div class="toast">${esc(state.toast)}</div>`:""}`}
    function render(){app.innerHTML=shell()}
    function setVariant(next){state.variant=next;state.editorOpen=false;const url=new URL(location.href);url.searchParams.set("variant",next);history.replaceState({},"",url);render()}
    function cycleVariant(direction){const keys=Object.keys(variantNames);const next=(keys.indexOf(state.variant)+direction+keys.length)%keys.length;setVariant(keys[next])}
    function toast(message){state.toast=message;render();setTimeout(()=>{state.toast="";render()},1700)}
    function openEditor(id){state.selectedId=id;state.editorOpen=true;render()}
    function setStatus(id,status){const d=state.drafts.find(x=>x.id===id);if(!d)return;d.status=status;state.selectedId=id;render()}
    function nextReview(delta=1){const queue=state.drafts.filter(d=>!d.hidden);state.reviewIndex=(state.reviewIndex+delta+queue.length)%queue.length;state.selectedId=queue[state.reviewIndex].id;render()}
    function simulatePackage(){state.packageStarted=true;const items=shortlist();items.forEach((d,index)=>{state.packageStates[d.id]={kind:"busy",title:"Создание начато",detail:"Независимая операция; ожидается suspend и readback."}});render();
      items.forEach((d,index)=>{
        setTimeout(()=>{if(index===1){state.packageStates[d.id]={kind:"error",title:"Ошибка до создания",detail:"Direct validation отклонил поле; другие операции продолжаются."};}else{state.packageStates[d.id]={kind:"busy",title:"Campaigns.suspend отправлен",detail:"Успех ещё не засчитан: ждём readback SUSPENDED."};}render()},600+index*250);
        setTimeout(()=>{if(index===0){state.packageStates[d.id]={kind:"ok",title:"SUSPENDED подтверждён",detail:"Отдельный non-serving readback получен; показы не начались."};}else if(index===2){state.packageStates[d.id]={kind:"error",title:"Readback неизвестен",detail:"Нельзя считать успехом; требуется повторный readback.",retry:true};}render()},1500+index*300);
      });
    }
    app.addEventListener("click",event=>{const el=event.target.closest("[data-action]");if(!el)return;const action=el.dataset.action,id=el.dataset.id;
      if(action==="variant-prev")cycleVariant(-1); else if(action==="variant-next")cycleVariant(1); else if(action==="edit")openEditor(id); else if(action==="select"){state.selectedId=id;render()} else if(action==="close-editor"){state.editorOpen=false;render()} else if(action==="exclude"){const d=state.drafts.find(x=>x.id===id);setStatus(id,d.status==="excluded"?"available":"excluded")} else if(action==="shortlist"){const d=state.drafts.find(x=>x.id===id);if(d.publishable)setStatus(id,d.status==="shortlisted"?"available":"shortlisted")} else if(action==="shortlist-next"){setStatus(id,"shortlisted");nextReview(1)} else if(action==="prev-review")nextReview(-1); else if(action==="next-review")nextReview(1); else if(action==="package"){if(shortlist().length){state.step="package";state.editorOpen=false;window.scrollTo({top:0,behavior:"smooth"});render()}} else if(action==="back-drafts"){state.step="draft";state.packageStarted=false;state.confirmed=false;state.packageStates={};render()} else if(action==="save-editor"){state.editorOpen=false;toast("Ревизия кампании сохранена в памяти prototype; score и fingerprint считаются пересчитанными.")} else if(action==="confirm"){state.confirmed=el.checked;render()} else if(action==="simulate-package")simulatePackage(); else if(action==="retry-readback"){state.packageStates[id]={kind:"busy",title:"Повторный readback",detail:"Проверяем состояние независимо от остальных кампаний."};render();setTimeout(()=>{state.packageStates[id]={kind:"ok",title:"SUSPENDED подтверждён",detail:"Повторный readback подтвердил non-serving финал."};render()},900)}
    });
    app.addEventListener("change",event=>{const el=event.target;if(el.dataset.filter==="kind"){state.kindFilter=el.value;render()}else if(el.dataset.filter==="evidence"){state.evidenceFilter=el.value;render()}else if(el.dataset.filter==="sort"){state.sort=el.value;render()}});
    app.addEventListener("input",event=>{const el=event.target;if(!el.dataset.field)return;const form=el.closest("[data-editor-id]");const d=state.drafts.find(x=>x.id===form.dataset.editorId);d[el.dataset.field]=el.value;const s=scoreOf(d);document.querySelectorAll("[data-live-score]").forEach(n=>n.textContent=s.score);document.querySelectorAll("[data-live-delta]").forEach(n=>n.textContent=s.delta===0?"Без material change":`После ручной правки: ${s.delta>0?"+":""}${s.delta}`)});
    document.addEventListener("keydown",event=>{if(["INPUT","TEXTAREA","SELECT"].includes(document.activeElement.tagName)||document.activeElement.isContentEditable)return;if(event.key==="ArrowLeft")cycleVariant(-1);if(event.key==="ArrowRight")cycleVariant(1)});
    render();
  </script>
</body>
</html>
