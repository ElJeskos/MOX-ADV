[build-system]
requires = ["setuptools>=58"]
build-backend = "setuptools.build_meta"

[project]
name = "mox-adv"
version = "0.1.0"
description = "Safe local MOX-ADV prototype bootstrap"
requires-python = ">=3.9"
dependencies = [
    "vercel>=0.5,<1 ; python_full_version >= '3.10'",
]

[project.scripts]
mox-adv = "mox_adv.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mox_adv = ["ui/*.css", "ui/*.html", "ui/*.js"]
