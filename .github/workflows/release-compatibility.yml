name: Release compatibility

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  clean-wheel-release:
    name: ${{ matrix.os }} / CPython ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            python: "3.9"
          - os: ubuntu-24.04
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install exact release test tooling
        run: |
          python -m pip install --disable-pip-version-check \
            'setuptools==75.8.2' \
            'wheel==0.45.1' \
            -r requirements-e2e.txt
          dependency_wheelhouse="${RUNNER_TEMP}/mox-adv-release-dependencies"
          mkdir -p "$dependency_wheelhouse"
          python -m pip download --disable-pip-version-check \
            --only-binary=:all: \
            --dest "$dependency_wheelhouse" \
            -r requirements-release.txt
          echo "MOX_ADV_RELEASE_DEPENDENCY_WHEELHOUSE=$dependency_wheelhouse" \
            >> "$GITHUB_ENV"
          python -m playwright install chromium
      - name: Validate scope and knowledge bundle
        run: make verify
      - name: Enforce Module API v1 compatibility
        run: |
          baseline_file="${RUNNER_TEMP}/module-api-v1-baseline.json"
          git show 0d8ea21:openapi/module-api-v1.openapi.json > "$baseline_file"
          python scripts/check_module_openapi_compatibility.py \
            "$baseline_file" \
            openapi/module-api-v1.openapi.json
      - name: Run complete legacy, contract, and release regression
        env:
          PYTHONPATH: src:.
        run: python -m unittest discover -s tests -p 'test_*.py'
